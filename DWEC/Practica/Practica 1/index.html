<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBC</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
    <link rel="icon" href="imgs/bbc.jpg">
</head>
<body>
    <main>
        <h1 id="title"><strong>B</strong>ig <strong>B</strong>ank for <strong>C</strong>onsumers</h1>
        <h3 id="saldo">Saldo: <strong id="total">1000</strong>€</h3>
        <section>
            <div id="ingreso">
                <p id="text1">Total a ingresar: </p>
                <input id="inputI" type="number" min="0" value="0">
                <input id="buttonI" type="button" value="Ingresar">
            </div>
            <div id="retirada">
                <p id="text2">Total a retirar:</p>
                <input id="inputR" type="number" min="0" value="0">
                <input id="buttonR" type="button" value="Retirar">
            </div>
        </section>
    </main>
    <footer>&copy;Anas Inani Marouf</footer>
</body>
</html>
